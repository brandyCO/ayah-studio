name: Deploy to GitHub Pages

on:
  # Manual only (owner 2026-11-16: the repo is private, no run without his OK).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The app must never go live before the database changes it calls (2026-11-23: News was live 3.5 h before its
  # migration). Every migration in supabase/migrations must already be applied on the live database, else stop here
  # and run "Database rules" (supabase.yml) first. Reads supabase_migrations.schema_migrations through the Management
  # API with SUPABASE_ACCESS_TOKEN; without the token it only warns.
  migrations:
    runs-on: ubuntu-latest
    env:
      SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jposubjybzstfmnngews
    steps:
      - uses: actions/checkout@v4
      - name: Every migration is live
        run: |
          if [ -z "$SB_TOKEN" ]; then echo "::warning::No SUPABASE_ACCESS_TOKEN: migrations not checked."; exit 0; fi
          live=$(curl -sf -X POST -H "Authorization: Bearer $SB_TOKEN" -H 'Content-Type: application/json' \
            -d '{"query":"select version from supabase_migrations.schema_migrations"}' \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" | jq -r '.[].version') \
            || { echo "::error::Could not read the live migrations."; exit 1; }
          missing=$(ls supabase/migrations/*.sql | sed 's#.*/##' | cut -d_ -f1 | sort | comm -23 - <(echo "$live" | sort))
          if [ -n "$missing" ]; then
            echo "::error::Not on the live database yet: $(echo $missing). Run \"Database rules\" (supabase.yml) on main first."
            exit 1
          fi
          echo "All $(ls supabase/migrations/*.sql | wc -l) migrations are live."

  build:
    needs: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Pixabay search proxy (proxy/README.md); empty → the app hides the Pixabay library.
          VITE_PIXABAY_PROXY: ${{ vars.PIXABAY_PROXY }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          VITE_HARAKAT_URL: ${{ vars.HARAKAT_URL }}
          # Cloudflare Turnstile site key (public) for the check before guest sign-ins; empty = no check.
      - run: node scripts/check-size.mjs # speed budget: first-load JS + CSS
      # GitHub Pages only while the repo is public (a private repo on the free plan has no Pages site).
      - uses: actions/configure-pages@v5
        if: ${{ !github.event.repository.private }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The same build on Cloudflare (files/wrangler.toml), as two static workers with the same files:
  #  - `ayah-studio`: the web app's address (https://ayah-studio.<account>.workers.dev/, src/cloud/config.ts PUBLIC_URL),
  #    which replaces GitHub Pages once the repo is private;
  #  - `ayah-studio-files`: where the service worker and the apps fetch code, data, fonts and backgrounds (src/net.ts FILES).
  # Static files on Cloudflare's free plan are free and unlimited. Needs the repo secrets CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID (the same as the edge proxy); without them it is skipped. With SUPABASE_ACCESS_TOKEN it also
  # makes sure Supabase Auth sends Google sign-ins back to the new address (adds it to the redirect allow-list).
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: files
      cancel-in-progress: false
    env:
      CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.CF_TOKEN_RAW != ''
        with:
          sparse-checkout: files
      - uses: actions/setup-node@v4
        if: env.CF_TOKEN_RAW != ''
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: env.CF_TOKEN_RAW != ''
        with:
          name: github-pages
          path: /tmp/pages
      - name: Tidy the Cloudflare secrets
        if: env.CF_TOKEN_RAW != ''
        run: |
          token=$(printf %s "$CF_TOKEN_RAW" | tr -d '[:space:]')
          account=$(printf %s "$CF_ACCOUNT_RAW" | tr -d '[:space:]')
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Unpack the build
        if: env.CF_TOKEN_RAW != ''
        run: |
          mkdir -p files/site
          tar -xf /tmp/pages/artifact.tar -C files/site
          cp files/_headers files/site/_headers
          n=$(find files/site -type f | wc -l)
          echo "$n files, $(du -sh files/site | cut -f1)"
          # Cloudflare's free plan takes up to 20,000 files in one version, 25 MB each.
          test "$n" -lt 20000
          test -z "$(find files/site -type f -size +24M)"
          test -s files/site/version.json
      - name: Deploy
        if: env.CF_TOKEN_RAW != ''
        working-directory: files
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee /tmp/deploy.log
          npx --yes wrangler@4 deploy --name ayah-studio 2>&1 | tee /tmp/deploy-site.log
      - name: Check the copy answers with CORS and this build
        if: env.CF_TOKEN_RAW != ''
        run: |
          url=$(grep -oE 'https://ayah-studio-files\.[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          test -n "$url"
          want=$(cat files/site/version.json)
          js=$(cd files/site && ls assets/*.js | head -1)
          words=$(cd files/site && find data/words -name '*.json' | head -1)
          for p in version.json fonts/qcf-v2/p50.woff2 "$words" "$js"; do
            for i in 1 2 3 4 5 6; do
              h=$(curl -sfI -H 'Origin: https://ayah-studio.brandlift-888.workers.dev' "$url/$p" || true)
              echo "$h" | grep -qi '^access-control-allow-origin: \*' && break
              sleep 10
            done
            echo "$h" | grep -qi '^access-control-allow-origin: \*' || { echo "::error::$p did not answer with CORS"; echo "$h"; exit 1; }
            echo "ok $p"
          done
          got=$(curl -sf "$url/version.json")
          test "$got" = "$want" || { echo "::error::Cloudflare serves $got, this build is $want"; exit 1; }
          echo "The app's files are served from $url ($got)" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the web app's address
        if: env.CF_TOKEN_RAW != ''
        run: |
          site=$(grep -oE 'https://ayah-studio\.[a-z0-9-]+\.workers\.dev' /tmp/deploy-site.log | head -1)
          test -n "$site" || { echo "::error::No address in the deploy log"; exit 1; }
          echo "SITE=$site" >> "$GITHUB_ENV"
          want=$(cat files/site/version.json)
          for i in 1 2 3 4 5 6; do got=$(curl -sf "$site/version.json" || true); [ "$got" = "$want" ] && break; sleep 10; done
          test "$got" = "$want" || { echo "::error::$site serves $got, this build is $want"; exit 1; }
          curl -sf "$site/" | grep -q '<title>Ayah Studio</title>' || { echo "::error::$site/ is not the app"; exit 1; }
          # Cloudflare answers /privacy.html with a redirect to /privacy (html_handling auto-trailing-slash), so follow it.
          curl -sfL "$site/privacy.html" | grep -q 'id="delete"' || { echo "::error::$site/privacy.html missing"; exit 1; }
          curl -sf "$site/sw.js" > /dev/null || { echo "::error::$site/sw.js missing"; exit 1; }
          grep -q "$site/" files/site/assets/*.js || echo "::warning::The build's PUBLIC_URL is not $site/ (src/cloud/config.ts)"
          echo "The web app is live at $site/" >> "$GITHUB_STEP_SUMMARY"
      - name: Let Google sign-ins come back to the new address
        if: env.CF_TOKEN_RAW != '' && env.SB_TOKEN != ''
        run: |
          api=https://api.supabase.com/v1/projects/jposubjybzstfmnngews/config/auth
          list=$(curl -sf -H "Authorization: Bearer $SB_TOKEN" "$api" | jq -r '.uri_allow_list // ""')
          case ",$list," in *",$SITE/**,"*) echo "Already allowed: $SITE/**"; exit 0;; esac
          new=$(printf '%s' "${list:+$list,}$SITE/**")
          jq -n --arg l "$new" '{uri_allow_list: $l}' | curl -sf -X PATCH -H "Authorization: Bearer $SB_TOKEN" -H 'Content-Type: application/json' -d @- "$api" > /dev/null
          echo "Supabase Auth now also allows $SITE/**" >> "$GITHUB_STEP_SUMMARY"
