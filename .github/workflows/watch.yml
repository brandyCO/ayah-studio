name: Deploy free-plan watch

# Deploys watch/ (Cloudflare Worker ayah-studio-watch): every 10 minutes how busy the app is, every hour how close the
# free plans are, as GitHub issues assigned to the owner (labels `busy`, `limit`). It replaces busy.yml and limits.yml so
# the private repo's Actions minutes are not used for them. Run by hand only (owner rule: no GitHub run without asking).
# Before deploying it tests the code (watch/test.mjs) and reads the real numbers once without writing anything.
# Secrets: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (deploy and Workers analytics), SUPABASE_ACCESS_TOKEN,
# optional SUPABASE_LOGS_TOKEN (egress), ALERTS_GITHUB_TOKEN (fine-grained token, this repo only, Issues: read and
# write; without it the worker cannot open issues and this run fails).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_LOGS_TOKEN: ${{ secrets.SUPABASE_LOGS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.ALERTS_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: watch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tidy the secrets
        run: |
          token=$(printf %s "$CF_TOKEN_RAW" | tr -d '[:space:]'); account=$(printf %s "$CF_ACCOUNT_RAW" | tr -d '[:space:]')
          echo "::add-mask::$token"; echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"; echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          echo "CF_TOKEN=$token" >> "$GITHUB_ENV"; echo "CF_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          test -n "$token" || { echo "::error::CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          test -n "$GITHUB_TOKEN" || { echo "::error::ALERTS_GITHUB_TOKEN is not set (see the top of this file)"; exit 1; }
      - name: Test the code
        run: node watch/test.mjs
      - name: Read the real numbers once (writes nothing)
        run: |
          {
            echo '### Limits'; node watch/run.mjs limits --dry
            echo; echo '### People at once'; node watch/run.mjs busy --dry
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Deploy the worker and its secrets
        working-directory: watch
        run: |
          npx --yes wrangler@4 deploy
          node -e 'const k=["SUPABASE_ACCESS_TOKEN","SUPABASE_LOGS_TOKEN","CF_TOKEN","CF_ACCOUNT_ID","GITHUB_TOKEN"];console.log(JSON.stringify(Object.fromEntries(k.filter(x=>process.env[x]).map(x=>[x,process.env[x]]))))' > /tmp/s.json
          npx --yes wrangler@4 secret bulk /tmp/s.json
          rm /tmp/s.json
          echo "Deployed ayah-studio-watch (every 10 min + hourly)." >> "$GITHUB_STEP_SUMMARY"
