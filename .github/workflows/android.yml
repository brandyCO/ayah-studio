name: Android APK

# Builds the Capacitor Android app (debug APK, sideloadable) as an artifact: Actions → this run →
# Artifacts → ayah-studio-apk. Signed with the app's key from the repo secrets
# ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD (when set), so updates install over the old app.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
        env:
          # Stock-library proxy (proxy/README.md); empty → the app hides the free library.
          VITE_PIXABAY_PROXY: ${{ vars.PIXABAY_PROXY }}
      - run: npx cap sync android
      - name: Signing key
        if: env.KEYSTORE_B64 != ''
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Stray spaces or line breaks from copy-pasting the secrets are ignored.
          printf %s "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/app.keystore"
          PW=$(printf %s "$PW" | tr -d '[:space:]')
          if ! keytool -list -keystore "$RUNNER_TEMP/app.keystore" -storetype PKCS12 -storepass "$PW" -alias ayahstudio > /dev/null 2>&1; then
            echo "::error::The app's signing key could not be opened. Check the repo secrets: ANDROID_KEYSTORE_BASE64 = the whole long line from the key file, ANDROID_KEYSTORE_PASSWORD = only the password line."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/app.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: ayah-studio-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
