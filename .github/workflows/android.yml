name: Android APK

# Builds the Capacitor Android app (debug APK, sideloadable) as an artifact: Actions → this run →
# Artifacts → ayah-studio-apk.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
        env:
          # Stock-library proxy (proxy/README.md); empty → the app hides the free library.
          VITE_PIXABAY_PROXY: ${{ vars.PIXABAY_PROXY }}
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: ayah-studio-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
