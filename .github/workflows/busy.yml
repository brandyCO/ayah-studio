# How busy the live app is (owner request 2026-11-14, after the launch test on staging: the free Supabase server stalled at
# about 700 players at once). Every 10 minutes this counts the people using the app right now — signed-in accounts that
# reported to Ranks, were reading / listening ("reading now") or synced in the last 5 minutes — and the database calls a
# second (pg_stat_statements, sampled 60 s apart). At 500 people an issue "Busy: …" is opened and assigned to the owner
# (GitHub emails and notifies the phone), so Supabase can be upgraded before the ~700 limit slows the app down. It closes
# itself once under 400 for a check. Signed-out people are not counted (they hardly use the database). Read only: no data
# leaves the runner, only the counts in the run summary.
name: How busy is the app
on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
    inputs:
      line:
        description: 'People at once that open the issue (for a test)'
        default: '500'
permissions:
  contents: read
  issues: write
concurrency:
  group: busy
  cancel-in-progress: false
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: jposubjybzstfmnngews
      LINE: ${{ inputs.line || '500' }}
    steps:
      - name: Count people at once
        id: count
        run: |
          set -uo pipefail
          HOSTS=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/database/pooler" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); d=d if isinstance(d,list) else [d]; print(' '.join(dict.fromkeys(x['db_host'] for x in d if x.get('db_host'))))" || true)
          PW=$(python3 -c "import os,urllib.parse; print(urllib.parse.quote(os.environ['DB_PASSWORD'].strip(), safe=''))")
          URL=""
          for h in $HOSTS aws-1-ap-northeast-1.pooler.supabase.com aws-0-ap-northeast-1.pooler.supabase.com; do
            if psql "postgresql://postgres.$PROJECT_REF:$PW@$h:5432/postgres" -tAc 'select 1' > /dev/null 2>&1; then
              URL="postgresql://postgres.$PROJECT_REF:$PW@$h:5432/postgres"; break
            fi
          done
          [ -n "$URL" ] || { echo "::error::Could not reach the database."; exit 1; }
          calls() { psql "$URL" -tAc "select coalesce(sum(calls), 0) from extensions.pg_stat_statements" 2>/dev/null || echo 0; }
          C1=$(calls); T1=$(date +%s.%N)
          PEOPLE=$(psql "$URL" -tA -c "set statement_timeout = '30s'" -c "
            select count(*) from (
              select user_id from public.rank_players
                where last_report > now() - interval '5 minutes' or live_at > now() - interval '5 minutes'
              union
              select user_id from public.user_docs where updated_at > now() - interval '5 minutes'
            ) s" | tail -1)
          CONNS=$(psql "$URL" -tAc "select count(*) from pg_stat_activity where datname = current_database()")
          sleep 60
          C2=$(calls); T2=$(date +%s.%N)
          RATE=$(python3 -c "print(max(0, round(($C2 - $C1) / ($T2 - $T1))))")
          echo "People at once (signed in, last 5 min): $PEOPLE · database calls a second: $RATE · connections: $CONNS" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "people=$PEOPLE" >> "$GITHUB_OUTPUT"; echo "rate=$RATE" >> "$GITHUB_OUTPUT"; echo "conns=$CONNS" >> "$GITHUB_OUTPUT"
      - name: Tell the owner
        uses: actions/github-script@v7
        env:
          PEOPLE: ${{ steps.count.outputs.people }}
          RATE: ${{ steps.count.outputs.rate }}
          CONNS: ${{ steps.count.outputs.conns }}
        with:
          script: |
            const people = Number(process.env.PEOPLE), line = Number(process.env.LINE || 500);
            const { data } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'busy' });
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const now = `${people} people at once, ${process.env.RATE} database calls a second, ${process.env.CONNS} connections`;
            if (people >= line && !data.length) {
              await github.rest.issues.create({ ...context.repo, title: `Busy: ${people} people at once`, labels: ['busy'], assignees: [context.repo.owner],
                body: `The app is getting busy: ${now}.\n\nThe launch test showed the free Supabase server slows down at about 700 people at once. Nothing is slow yet. To stay ahead of it: Supabase dashboard → project → Settings → Billing → Pro ($25/month), then Settings → Compute and Disk → Small or Medium. Or ask Claude to do the checks with you.\n\nCounted: signed-in accounts that reported progress, were reading or listening, or synced in the last 5 minutes (people not signed in are not counted).\n\nCheck: ${run}\n\nThis issue closes itself once it is back under ${Math.round(line * 0.8)}.` });
            } else if (data.length) {
              for (const i of data) {
                if (people < line * 0.8) {
                  await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: `Quieter again: ${now}.` });
                  await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
                } else if (people >= line * 1.2 && !i.title.includes(`${people}`)) {
                  await github.rest.issues.update({ ...context.repo, issue_number: i.number, title: `Busy: ${people} people at once` });
                }
              }
            }
