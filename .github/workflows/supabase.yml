name: Database rules

# Row-level security tests (pgTAP) for supabase/migrations, run against a local Supabase database
# started by the Supabase CLI in the runner — no access token, the live project is never touched.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # Postgres only (applies supabase/migrations), then supabase/tests/*.sql with pg_prove.
      - run: supabase db start
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup

  # After the tests pass on main: apply new migrations to the live project. Needs the repo secrets
  # SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens; Project Settings + API Keys read,
  # Database read-write) and SUPABASE_DB_PASSWORD (the database password); without them this job only
  # prints a notice. It connects to the database directly through the session pooler (the token only
  # looks up the pooler's address), so it needs no wider token than that. Migrations are idempotent;
  # applied ones are recorded in supabase_migrations.schema_migrations and skipped next time.
  deploy:
    needs: rls
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: jposubjybzstfmnngews
    steps:
      - uses: actions/checkout@v4
      - name: No secrets yet
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_DB_PASSWORD == ''
        run: echo "::notice::Migrations were not applied — add the repo secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD (docs/together.md §7), or paste the new file from supabase/migrations into the Supabase SQL editor."
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != ''
        with:
          version: 2.120.0
      - name: Apply migrations
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != ''
        run: |
          set -uo pipefail
          # The session pooler's address (IPv4; the direct db.<ref>.supabase.co host is IPv6-only).
          HOSTS=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/database/pooler" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); d=d if isinstance(d,list) else [d]; print(' '.join(dict.fromkeys(x['db_host'] for x in d if x.get('db_host'))))" || true)
          echo "Pooler from the API: ${HOSTS:-unavailable}"
          PW=$(python3 -c "import os,urllib.parse; print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'].strip(), safe=''))")
          for h in $HOSTS aws-1-ap-northeast-1.pooler.supabase.com aws-0-ap-northeast-1.pooler.supabase.com; do
            echo "Connecting through $h"
            if supabase db push --db-url "postgresql://postgres.$PROJECT_REF:$PW@$h:5432/postgres" --include-all; then
              echo "::notice::Migrations applied to the live database."
              exit 0
            fi
          done
          echo "::error::Could not apply the migrations (see above). Check SUPABASE_DB_PASSWORD (Project Settings → Database)."
          exit 1
