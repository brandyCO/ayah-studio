name: Database rules

# Row-level security tests (pgTAP) for supabase/migrations, run against a local Supabase database
# started by the Supabase CLI in the runner — no access token, the live project is never touched.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # Postgres only (applies supabase/migrations), then supabase/tests/*.sql with pg_prove.
      - run: supabase db start
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup

  # After the tests pass on main: apply new migrations to the live project. Needs the repo secrets
  # SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens) and SUPABASE_DB_PASSWORD (the
  # database password); without them this job only prints a notice. Migrations are idempotent.
  deploy:
    needs: rls
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: No secrets yet
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_DB_PASSWORD == ''
        run: echo "::notice::Migrations were not applied — add the repo secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD (docs/together.md §7), or paste the new file from supabase/migrations into the Supabase SQL editor."
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != ''
        with:
          version: 2.120.0
      - if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != ''
        run: |
          supabase link --project-ref jposubjybzstfmnngews --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all
