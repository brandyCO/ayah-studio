# Daily backup of the live database (owner request 2026-11-13: nothing users earned may ever be lost).
# Every night: the schemas public + auth are dumped through the session pooler, and the files users keep in Storage
# (voice clips) are downloaded; both are encrypted with the secret BACKUP_KEY (until it is added: the database
# password; key.txt says which) — the repo is public, nothing leaves the runner unencrypted — and kept 30 days as the artifact
# "db-backup-<date>". The same run restores it into an empty Postgres and checks every table has the same rows,
# so a backup that would not restore fails loudly (and opens an issue). How to restore: docs/backup.md.
name: Database backup
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_KEY: ${{ secrets.BACKUP_KEY || secrets.SUPABASE_DB_PASSWORD }}
      KEY_NAME: ${{ secrets.BACKUP_KEY != '' && 'BACKUP_KEY' || 'SUPABASE_DB_PASSWORD' }}
      PROJECT_REF: jposubjybzstfmnngews
    services:
      restore:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore
        ports: ['5433:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Postgres 17 client
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Dump and encrypt
        run: |
          set -uo pipefail
          HOSTS=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/database/pooler" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); d=d if isinstance(d,list) else [d]; print(' '.join(dict.fromkeys(x['db_host'] for x in d if x.get('db_host'))))" || true)
          PW=$(python3 -c "import os,urllib.parse; print(urllib.parse.quote(os.environ['DB_PASSWORD'].strip(), safe=''))")
          for h in $HOSTS aws-1-ap-northeast-1.pooler.supabase.com aws-0-ap-northeast-1.pooler.supabase.com; do
            echo "Dumping through $h"
            URL="postgresql://postgres.$PROJECT_REF:$PW@$h:5432/postgres"
            if bash scripts/db-backup.sh dump "$URL" backup; then
              echo "$KEY_NAME" > backup/key.txt
              echo "$h" > /tmp/dbhost
              exit 0
            fi
          done
          echo "::error::Could not dump the database."; exit 1
      - name: Stored files (voice clips)
        # Needs the service key: the repo secret SUPABASE_SERVICE_KEY, else it is asked from the Supabase management
        # API with SUPABASE_ACCESS_TOKEN. Without either the database backup still goes ahead and the run says why.
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -uo pipefail
          if [ -z "$SERVICE_KEY" ]; then
            code=$(curl -s -o /tmp/keys.json -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true")
            if [ "$code" = 200 ]; then
              SERVICE_KEY=$(python3 -c "import json; print(next((k.get('api_key') or '' for k in json.load(open('/tmp/keys.json')) if k.get('name') == 'service_role'), ''))")
            else
              echo "Supabase management API answered $code."
            fi
            rm -f /tmp/keys.json
          fi
          if [ -z "$SERVICE_KEY" ]; then
            echo "::warning::Stored files (voice clips) were not backed up: add the repo secret SUPABASE_SERVICE_KEY (Supabase → Project Settings → API keys → service_role)."
            echo skipped > backup/files.txt
            exit 0
          fi
          echo "::add-mask::$SERVICE_KEY"
          set -e
          PW=$(python3 -c "import os,urllib.parse; print(urllib.parse.quote(os.environ['DB_PASSWORD'].strip(), safe=''))")
          SERVICE_KEY="$SERVICE_KEY" SUPABASE_URL="https://$PROJECT_REF.supabase.co" \
            bash scripts/db-backup.sh files "postgresql://postgres.$PROJECT_REF:$PW@$(cat /tmp/dbhost):5432/postgres" backup
          bash scripts/db-backup.sh checkfiles backup
      - name: Restore into an empty database and compare
        run: bash scripts/db-backup.sh verify "postgresql://postgres:restore@localhost:5433/postgres" backup
      - id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ steps.day.outputs.d }}
          path: backup/
          retention-days: 30
          if-no-files-found: error
      - name: Tell the owner when it fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Database backup failed';
            const { data } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'backup' });
            const body = `The nightly backup failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (data.length) await github.rest.issues.createComment({ ...context.repo, issue_number: data[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ['backup'], assignees: [context.repo.owner] });
