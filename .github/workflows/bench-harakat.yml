# Temporary: measures the harakat model's speed on an ARM CPU (phone-class). Removed before merging.
name: Bench harakat model
on:
  push:
    branches: [claude/project-thread-nedal7]
    paths: [scripts/bench-harakat.py, .github/workflows/bench-harakat.yml]
jobs:
  bench:
    strategy:
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install --quiet onnxruntime numpy
      - run: python3 scripts/bench-harakat.py
