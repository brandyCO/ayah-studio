name: Deploy big files to Cloudflare

# The mushaf page fonts (~95 MB for the whole mushaf) and the word timings (~34 MB a reciter) are the app's
# heaviest downloads. GitHub Pages allows about 100 GB a month, so they are served from Cloudflare instead
# (files/wrangler.toml: a Worker with static assets only, free and unlimited). The app asks Cloudflare first
# and falls back to the Pages site (src/net.ts FILES, public/sw.js). Needs the repo secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (the same as the edge proxy); without them it is skipped.

on:
  push:
    branches: [main]
    paths: ['public/fonts/**', 'public/data/words/**', 'files/**', '.github/workflows/files.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: files
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CF_TOKEN_RAW != ''
      - uses: actions/setup-node@v4
        if: env.CF_TOKEN_RAW != ''
        with:
          node-version: 22
      - name: Tidy the Cloudflare secrets
        if: env.CF_TOKEN_RAW != ''
        run: |
          token=$(printf %s "$CF_TOKEN_RAW" | tr -d '[:space:]')
          account=$(printf %s "$CF_ACCOUNT_RAW" | tr -d '[:space:]')
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Gather the files
        if: env.CF_TOKEN_RAW != ''
        run: |
          mkdir -p files/site/data
          cp -r public/fonts files/site/fonts
          cp -r public/data/words files/site/data/words
          cp files/_headers files/site/_headers
          n=$(find files/site -type f | wc -l)
          echo "$n files, $(du -sh files/site | cut -f1)"
          # Cloudflare's free plan takes up to 20,000 files in one version.
          test "$n" -lt 20000
      - name: Deploy
        if: env.CF_TOKEN_RAW != ''
        working-directory: files
        run: npx --yes wrangler@4 deploy 2>&1 | tee /tmp/deploy.log
      - name: Check a font and a timings file answer with CORS
        if: env.CF_TOKEN_RAW != ''
        run: |
          url=$(grep -oE 'https://ayah-studio-files\.[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          test -n "$url"
          words=$(cd public && find data/words -name '*.json' | head -1)
          for p in fonts/qcf-v2/p50.woff2 "$words"; do
            for i in 1 2 3 4 5 6; do
              h=$(curl -sfI -H 'Origin: https://brandyco.github.io' "$url/$p" || true)
              echo "$h" | grep -qi '^access-control-allow-origin: \*' && break
              sleep 10
            done
            echo "$h" | grep -qi '^access-control-allow-origin: \*' || { echo "::error::$p did not answer with CORS"; echo "$h"; exit 1; }
            echo "ok $p"
          done
          echo "Files are served from $url" >> "$GITHUB_STEP_SUMMARY"
