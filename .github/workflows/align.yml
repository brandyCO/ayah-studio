name: Align recitations

# Word (and ayah) times for the reciters without them (scripts/align-plan.py: everyayah + mp3quran ones),
# made by forced alignment on GitHub's runners (scripts/align-batch.py). Raw results go to the branch
# `align-results` (align2/{key}/{surah}.json, words in the order recited with repeats; align/ = the first run); they are checked and turned into app data afterwards. Run it
# again to finish surahs a job did not reach: surahs already in `align-results` are skipped.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Reciter keys, comma-separated (empty = all; new:1 … new:4 = a batch of scripts/new-recordings.json)'
        required: false
        default: ''
      surahs:
        description: 'Only these surahs, one job per reciter (e.g. 112-114; empty = all, 4 jobs per reciter)'
        required: false
        default: ''
      scan:
        description: 'yes = instead, scan quranicaudio.com and archive.org for recordings (scripts/scan-sources.py); qdc = how the Quran.com recordings open (scripts/qdc-openings.py); openings = the same for the mp3quran reciters (scripts/fix-openings.py)'
        required: false
        default: 'no'

permissions:
  contents: write

concurrency:
  group: align-${{ inputs.scan }}-${{ inputs.only }}
  cancel-in-progress: false

jobs:
  plan:
    if: inputs.scan != 'yes' && inputs.scan != 'qdc' && inputs.scan != 'openings'
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
          SURAHS: ${{ inputs.surahs }}
        run: echo "jobs=$(python3 scripts/align-plan.py "$ONLY" "$SURAHS")" >> "$GITHUB_OUTPUT"

  align:
    needs: plan
    name: ${{ matrix.job.key }} · ${{ matrix.job.surahs }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        job: ${{ fromJson(needs.plan.outputs.jobs) }}
    env:
      ALIGN_MODEL: ${{ github.workspace }}/.cache/align-model
      MP3_CACHE: /tmp/mp3
      DEADLINE: '18000'
      RES: align2
      KEY: ${{ matrix.job.key }}
      KIND: ${{ matrix.job.kind }}
      SOURCE: ${{ matrix.job.source }}
      SURAHS: ${{ matrix.job.surahs }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/align.yml
      - name: Install ffmpeg and the model's libraries
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.11.0 torchaudio==2.11.0
          pip install -q transformers==5.19.0 numpy huggingface_hub
      - uses: actions/cache@v4
        with:
          path: .cache/align-model
          key: align-model-rabah2026-v_final
      - name: Download the model (Apache-2.0)
        run: |
          [ -f "$ALIGN_MODEL/model.safetensors" ] || python3 -c "from huggingface_hub import snapshot_download as d; d('rabah2026/wav2vec2-large-xlsr-53-arabic-quran-v_final', local_dir='$ALIGN_MODEL')"
      - name: Results so far
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse --branch align-results \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/res"
          git -C "$RUNNER_TEMP/res" sparse-checkout set "$RES/$KEY"
          mkdir -p out && cp -r "$RUNNER_TEMP/res/$RES/." out/ 2>/dev/null || true
      - name: Align
        run: python3 scripts/align-batch.py "$KIND" "$KEY" "$SOURCE" "$SURAHS" out
      - name: Save results
        if: always()
        run: |
          cd "$RUNNER_TEMP/res"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RES/$KEY" && cp "$GITHUB_WORKSPACE/out/$KEY/"*.json "$RES/$KEY/" 2>/dev/null || true
          git add "$RES/$KEY"
          git diff --cached --quiet && exit 0
          git commit -qm "Alignment: $KEY surahs $SURAHS"
          for i in 1 2 3 4 5 6 7 8; do
            git push -q origin HEAD:align-results && exit 0
            sleep $((RANDOM % 20 + 5)); git pull -q --rebase origin align-results
          done
          exit 1

  scan:
    if: inputs.scan == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg && pip install -q numpy
      - run: python3 scripts/scan-sources.py scan.json
      - name: Save the report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f scan.json ] || exit 0
          git clone -q --depth 1 --filter=blob:none --sparse --branch align-results \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/res"
          cd "$RUNNER_TEMP/res"
          git sparse-checkout set sources
          mkdir -p sources && cp "$GITHUB_WORKSPACE/scan.json" sources/scan.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources && git commit -qm "Source scan" && git push -q origin HEAD:align-results

  qdc-openings:
    if: inputs.scan == 'qdc'
    name: QDC openings · ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        id: [1, 2, 3, 4, 5, 6, 7, 9, 10, 12, 97, 161, 173]
    env:
      ALIGN_MODEL: ${{ github.workspace }}/.cache/align-model
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/align.yml
      - name: Install ffmpeg and the model's libraries
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.11.0 torchaudio==2.11.0
          pip install -q transformers==5.19.0 numpy huggingface_hub
      - uses: actions/cache@v4
        with:
          path: .cache/align-model
          key: align-model-rabah2026-v_final
      - name: Download the model (Apache-2.0)
        run: |
          [ -f "$ALIGN_MODEL/model.safetensors" ] || python3 -c "from huggingface_hub import snapshot_download as d; d('rabah2026/wav2vec2-large-xlsr-53-arabic-quran-v_final', local_dir='$ALIGN_MODEL')"
      - run: python3 scripts/qdc-openings.py ${{ matrix.id }} out
      - name: Save results
        if: always()
        run: |
          [ -f out/qdc${{ matrix.id }}.json ] || exit 0
          git clone -q --depth 1 --filter=blob:none --sparse --branch align-results \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/res"
          cd "$RUNNER_TEMP/res"
          git sparse-checkout set qdc-open
          mkdir -p qdc-open && cp "$GITHUB_WORKSPACE/out/qdc${{ matrix.id }}.json" qdc-open/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qdc-open && git commit -qm "QDC openings: ${{ matrix.id }}"
          for i in 1 2 3 4 5 6 7 8; do
            git push -q origin HEAD:align-results && exit 0
            sleep $((RANDOM % 20 + 5)); git pull -q --rebase origin align-results
          done
          exit 1

  openings:
    if: inputs.scan == 'openings'
    name: Openings · ${{ matrix.key }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        key: ['3', '12', '20', '217', '219', '221', '236', '245', '259', '273', 'islam-sobhi']
    env:
      ALIGN_MODEL: ${{ github.workspace }}/.cache/align-model
      GH_TOKEN: ${{ github.token }}
      KEY: ${{ matrix.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/align.yml
      - name: Install ffmpeg and the model's libraries
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.11.0 torchaudio==2.11.0
          pip install -q transformers==5.19.0 numpy huggingface_hub
      - uses: actions/cache@v4
        with:
          path: .cache/align-model
          key: align-model-rabah2026-v_final
      - name: Download the model (Apache-2.0)
        run: |
          [ -f "$ALIGN_MODEL/model.safetensors" ] || python3 -c "from huggingface_hub import snapshot_download as d; d('rabah2026/wav2vec2-large-xlsr-53-arabic-quran-v_final', local_dir='$ALIGN_MODEL')"
      - name: Results so far
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse --branch align-results \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/res"
          git -C "$RUNNER_TEMP/res" sparse-checkout set "align2/$KEY" openings
      - run: rm -f public/data/basmala.json && python3 scripts/fix-openings.py "$RUNNER_TEMP/res" "$KEY"
      - name: Save results
        if: always()
        run: |
          cd "$RUNNER_TEMP/res"
          mkdir -p "openings/$KEY"
          cp "$GITHUB_WORKSPACE/public/data/basmala.json" "openings/$KEY/basmala.json" 2>/dev/null || exit 0
          git -C "$GITHUB_WORKSPACE" diff --name-only -- "public/data/words/$KEY" | while read f; do cp "$GITHUB_WORKSPACE/$f" "openings/$KEY/"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openings && git commit -qm "Openings: $KEY"
          for i in 1 2 3 4 5 6 7 8; do
            git push -q origin HEAD:align-results && exit 0
            sleep $((RANDOM % 20 + 5)); git pull -q --rebase origin align-results
          done
          exit 1
