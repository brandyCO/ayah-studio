<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07130f">
<title>Ayah Studio</title>
<meta property="og:title" content="Ayah Studio">
<meta property="og:image" content="../og-b.jpg">
<link rel="icon" href="../icon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #07130f; }
  body { display: grid; place-items: center; }
  img { width: 72px; height: 72px; opacity: .9; animation: b 1.6s ease-in-out infinite; }
  @keyframes b { 50% { opacity: .55; transform: scale(.94); } }
  @media (prefers-reduced-motion: reduce) { img { animation: none; } }
</style>
</head>
<body>
<img src="../icon.svg" alt="">
<script>
/* Every link the app shares is https://<site>/i/#/<route> (src/native.ts shareableLink).
   With the app installed, the phone opens the app on that route itself (iPhone Universal Links:
   .well-known/apple-app-site-association; Android App Links: .well-known/assetlinks.json) and this
   page never loads. When it does load (no app, or an in-app browser that keeps links to itself):
   - stores.json says the app is in that phone's store → the store listing (Android: through an intent,
     which opens the app instead when it is installed);
   - otherwise → the web app on the same route. Flipping stores.json needs only a web deploy. */
(function () {
  var h = location.hash && location.hash.indexOf('#/') === 0 ? location.hash : '#/';
  var web = function () { location.replace('../' + h); };
  var ua = navigator.userAgent;
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (!android && !ios) return web();
  var done = false;
  var go = function (f) { if (!done) { done = true; f(); } };
  setTimeout(function () { go(web); }, 1500);
  fetch('stores.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
    if (android && s.android) {
      var play = 'https://play.google.com/store/apps/details?id=com.brandyco.ayahstudio';
      go(function () {
        location.replace('intent://' + location.host + location.pathname + '?r=' + encodeURIComponent(h) +
          '#Intent;scheme=https;package=com.brandyco.ayahstudio;S.browser_fallback_url=' + encodeURIComponent(play) + ';end');
      });
    } else if (ios && s.ios) {
      go(function () { location.replace('https://apps.apple.com/app/id6835381894'); });
    } else go(web);
  }).catch(function () { go(web); });
})();
</script>
</body>
</html>
