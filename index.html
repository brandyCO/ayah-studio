  <head>

    <meta property="og:title" content="Ayah Studio" />
    <meta property="og:description" content="Read the Quran, listen, and turn ayat into calm reels." />

    <script>
      // Start-up errors are kept so the rescue below can show them (owner report 2026-11-16: an empty green screen on iPhone).
      window.__bootErrors = [];
      window.addEventListener('error', function (e) { var t = e.target; if (t && t !== window && (t.src || t.href)) { window.__bootErrors.push('could not load ' + (t.src || t.href).split('/').pop()); return; } window.__bootErrors.push((e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); }, true);
      window.addEventListener('unhandledrejection', function (e) { var r = e.reason; window.__bootErrors.push('promise: ' + (r && (r.message || r)) ); });
    </script>
    <style>
      /* Fonts live in public/fonts (see LICENSES.md); relative URLs work on Pages, Capacitor and Tauri. */
      @font-face { font-family: 'UthmanicHafs'; src: url('./fonts/UthmanicHafs.woff2') format('woff2'); font-display: block; }
      @font-face { font-family: 'AmiriQuran'; src: url('./fonts/AmiriQuran.woff2') format('woff2'); font-display: swap; }
      /* Arabic the system font cannot draw (Quranic marks in surah names, Arabic interface): only loaded when needed */
      @font-face { font-family: 'QuranMarks'; src: url('./fonts/AmiriQuran.woff2') format('woff2'); font-display: swap; unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF; }
      /* The Arabic interface (Android has no Arabic in Roboto, so the Quran-marks face above used to take every Arabic
         UI word): plain Noto Sans Arabic (OFL), fetched only when Arabic interface text is on screen. Never the Quran text. */
      @font-face { font-family: 'ArabicUI'; src: url('./fonts/NotoSansArabic-Regular.woff2') format('woff2'); font-weight: 100 600; font-display: swap; unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F; }
      @font-face { font-family: 'ArabicUI'; src: url('./fonts/NotoSansArabic-Bold.woff2') format('woff2'); font-weight: 601 1000; font-display: swap; unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F; }
      /* Rounder translation font for the kid-friendly moods (docs/kids.md K5); never used for the Arabic. */
      @font-face { font-family: 'Nunito'; src: url('./fonts/Nunito-latin.woff2') format('woff2'); font-weight: 200 1000; font-display: swap; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: 'Nunito'; src: url('./fonts/Nunito-latin-ext.woff2') format('woff2'); font-weight: 200 1000; font-display: swap; unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
    </style>
    <script>
      // Opening on the mushaf (the usual launch): start the page layout download right away, in parallel
      // with the app's code, instead of after it (saves a round trip and the script time on a first visit).
      try {
        var h = location.hash;
        var onPage = (!h || h === '#' || h === '#/' || h.indexOf('#/s/') === 0) && localStorage.getItem('readerMode') !== 'translation' && localStorage.getItem('kidsOn') !== 'true';
        // The interface font: preloaded unless the app opens on a mushaf page, which shows no interface text until it is
        // tapped (on a slow connection its 38 KB would share the line with the page's own font and layout).
        if (!onPage) {
          var n = document.createElement('link');
          n.rel = 'preload'; n.as = 'font'; n.type = 'font/woff2'; n.crossOrigin = 'anonymous'; n.href = './fonts/Nunito-latin.woff2';
          document.head.appendChild(n);
        }
        if (onPage) {
          // The page left last time (or the surah's first page): its own small layout file and its font, so the words
          // can be drawn as soon as both are in. The whole layout (~85 KB) comes after the page is on screen.
          var lp = JSON.parse(localStorage.getItem('lastPage') || 'null');
          var home = !h || h === '#' || h === '#/', m = /^#\/s\/(\d+)$/.exec(h);
          var pg = lp && (home || h === lp[0]) ? lp[1] : m ? %SURAH_PAGES%[m[1] - 1] : home ? 1 : 0;
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'fetch'; l.crossOrigin = 'anonymous';
          l.href = pg >= 1 && pg <= 604 ? './data/mushaf/p' + pg + '.json?v=%DATA_VERSION%' : './data/mushaf.json?v=%DATA_VERSION%';
          document.head.appendChild(l);
          // Surah names and ayah counts (src/data/quran.ts loadMeta), needed before the page is drawn.
          var mt = document.createElement('link');
          mt.rel = 'preload'; mt.as = 'fetch'; mt.crossOrigin = 'anonymous'; mt.href = './data/meta.json?v=%DATA_VERSION%';
          document.head.appendChild(mt);
          if (pg >= 1 && pg <= 604) {
            var f = document.createElement('link');
            f.rel = 'preload'; f.as = 'font'; f.type = 'font/woff2'; f.crossOrigin = 'anonymous';
            f.href = './fonts/qcf-v2/p' + pg + '.woff2';
            document.head.appendChild(f);
          }
        }
      } catch (e) { /* storage blocked */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
    <script>
      // Boot rescue: if nothing has been drawn after 9 s (a stale offline copy, a script that failed to load), clear the
      // service worker and its caches and load once more; if that did not help either, say so with a Reload button and
      // the error, instead of leaving an empty screen.
      (function () {
        var app = document.getElementById('app');
        setTimeout(function () {
          if (!app || app.childElementCount > 0 || document.querySelector('dialog[open]')) { try { sessionStorage.removeItem('bootRescue'); } catch (e) {} return; }
          var tried = false;
          try { tried = sessionStorage.getItem('bootRescue') === '1'; sessionStorage.setItem('bootRescue', '1'); } catch (e) {}
          if (!tried) {
            var jobs = [];
            try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
            try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
            Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
            return;
          }
          var errs = (window.__bootErrors || []).slice(0, 4).join('\n');
          app.innerHTML = '<div style="font:16px/1.5 system-ui,sans-serif;padding:48px 24px;text-align:center;color:inherit">'
            + '<p style="font-size:20px;font-weight:700;margin:0 0 8px">Ayah Studio could not start</p>'
            + '<p style="margin:0 0 20px;opacity:.75">Please check your connection and try again.</p>'
            + '<button style="font:inherit;font-weight:700;padding:12px 28px;border-radius:999px;border:0;background:#0f8273;color:#fff">Reload</button>'
            + '<pre style="white-space:pre-wrap;text-align:left;font-size:12px;opacity:.6;margin-top:28px"></pre></div>';
          app.querySelector('pre').textContent = errs;
          app.querySelector('button').onclick = function () { try { sessionStorage.removeItem('bootRescue'); } catch (e) {} location.reload(); };
        }, 9000);
      })();
    </script>
  </body>
</html>
